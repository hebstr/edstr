on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: prek

permissions: read-all

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --all-files --skip prose-lint
