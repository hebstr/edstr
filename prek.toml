[[repos]]
repo = "local"
hooks = [
  { id = "prose-lint", name = "prose lint (.md/.qmd)", entry = "prose-lint", language = "system", files = '\.(md|qmd)$', exclude = '^(LICENSE\.md|tests/testthat/_snaps/)' },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" }
]

[[repos]]
repo = "https://github.com/posit-dev/air-pre-commit"
rev = "0.10.0"
hooks = [
  { id = "air-format", files = '\.(R|r)$' }
]

[[repos]]
repo = "https://github.com/etiennebacher/jarl-pre-commit"
rev = "0.5.0"
hooks = [
  { id = "jarl-check", files = '\.(R|r)$' }
]
